# totalray-gateway - dnsmasq: local network DHCP + DNS
# __PI_IP__ / __RANGE_START__ / __RANGE_END__ are substituted at install time.

listen-address=127.0.0.1,__PI_IP__
bind-interfaces
no-resolv
domain-needed
bogus-priv
cache-size=2000

# Primary: sing-box's own DNS module (splits Iranian/non-Iranian domains
# itself via geosite-ir, and resolves everything else through whatever
# verified proxy is currently active). Kept first/preferred since it's the
# only one of these that's Iran-domain-aware.
server=127.0.0.1#1053

# Fallback: sing-box's own DNS path is a single point of failure -- if its
# upstream (Cloudflare DoH) is throttled/blocked or pool B is briefly
# empty, DNS resolution for the whole LAN dies with it. `all-servers`
# below races every configured server for each query and uses whichever
# answers first, so as long as the primary is healthy and reasonably fast
# it keeps winning the race (it's a loopback hop, normally near-instant);
# these only actually matter when the primary is slow or not answering.
# These are excluded from sing-box's own auto_redirect by uid (see
# builder.py's tun exclude_uid), so they go genuinely direct rather than
# looping back through the same DNS path they're meant to be a fallback
# for. Picked for provider diversity -- Iranian ISPs are known to block
# specific public resolvers unpredictably rather than DNS wholesale, so a
# spread of independent operators/regions is more resilient than several
# servers from one company. Cloudflare/Google/Quad9 are global anycast
# (Quad9 specifically also has PoPs in Madrid and Barcelona); FDN (France)
# and Yandex.DNS (Russia) are picked for the European/nearby routes that
# have tended to perform better on this connection.
server=1.1.1.1         # Cloudflare, global anycast
server=9.9.9.9         # Quad9, global anycast incl. Madrid/Barcelona PoPs
server=8.8.8.8         # Google, global anycast
server=80.67.169.12    # FDN (France Data Network), France
server=77.88.8.8       # Yandex.DNS Basic, Russia
all-servers

# DHCP - only relevant if the router's DHCP is turned off (option A below);
# otherwise comment out the three lines below.
dhcp-range=__RANGE_START__,__RANGE_END__,255.255.255.0,12h
dhcp-option=3,__PI_IP__      # default gateway for devices
dhcp-option=6,__PI_IP__      # DNS server for devices
dhcp-authoritative
